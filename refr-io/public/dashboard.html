<!DOCTYPE html>
<html lang="en" class="bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Dashboard - refr.io</title>

    <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png?v=1.1">
    <link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png?v=1.1">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png?v=1.1">
    <link rel="icon" href="icon/favicon.ico?v=1.1" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>

    <meta name="description"
        content="View the latest referral links shared by the community. Your refr.io dashboard is the central hub for discovering and sharing great offers.">
</head>

<body class="antialiased text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto py-4 px-4 md:px-8 flex justify-between items-center">
            <a href="/dashboard.html" class="text-2xl font-bold text-brand-green">refr.io</a>
            <div id="logged-out-view" class="flex items-center gap-4">
                <a href="login.html"
                    class="font-semibold text-gray-600 hover:text-brand-green transition-colors">Login</a>
                <a href="signup.html"
                    class="bg-brand-green text-white font-semibold px-5 py-2 rounded-lg shadow-md hover:bg-emerald-700">Sign
                    Up</a>
            </div>
            <div id="logged-in-view" class="hidden items-center gap-4">
                <div class="relative">
                    <button id="user-menu-button"
                        class="flex items-center gap-2 font-semibold text-gray-600 hover:text-brand-green">

                        <svg class="h-6 w-6 text-gray-500 pointer-events-none" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>

                        <span id="welcome-message" class="pointer-events-none"></span>

                        <svg class="h-5 w-5 text-gray-500 pointer-events-none" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                                clip-rule="evenodd" />
                        </svg>
                    </button>

                    <div id="user-menu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1">
                        <a href="profile.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Your
                            Profile</a>
                        <button id="logout-btn"
                            class="w-full text-left block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-8">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-2 mb-6">
            <h1 class="text-xl font-semibold text-gray-900">Latest Referrals</h1>
            <a id="post-referral-link" href="post.html"
                class="hidden bg-brand-green text-white font-semibold px-5 py-2 rounded-lg shadow-md hover:bg-emerald-700 text-center">+
                Post a Referral</a>
        </div>

        <div class="flex flex-col sm:flex-row items-center gap-4 mb-6">
            <div class="relative w-full sm:w-64">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                    <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                        fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <input type="text" id="search-input" placeholder="Search..."
                    class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg shadow-sm ...">
            </div>
            <div class="flex-grow"></div>

            <div class="relative">
                <select id="filter-category"
                    class="appearance-none border border-slate-300 rounded-lg px-3 pr-10 py-2 min-h-[40px] bg-white">
                    <option value="">All Categories</option>
                    <option>Finance</option>
                    <option>Food</option>
                    <option>Gaming</option>
                    <option>Services</option>
                    <option>Shopping</option>
                    <option>Software</option>
                    <option>Travel</option>
                    <option>Other</option>
                </select>
                <!-- <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                    <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                        fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M10 3a.75.75 0 01.53.22l3.5 3.5a.75.75 0 01-1.06 1.06L10 4.81 6.53 8.28a.75.75 0 01-1.06-1.06l3.5-3.5A.75.75 0 0110 3zm-3.72 9.28a.75.75 0 011.06 0L10 15.19l3.47-3.47a.75.75 0 111.06 1.06l-4 4a.75.75 0 01-1.06 0l-4-4a.75.75 0 010-1.06z"
                            clip-rule="evenodd" />
                    </svg>
                </div> -->
            </div>
        </div>

        <div id="referrals-list" class="space-y-4">
            <div class="skeleton-card">
                <div class="h-4 bg-slate-200 rounded w-1/4 mb-4"></div>
                <div class="flex justify-between items-center">
                    <div class="space-y-2 flex-grow">
                        <div class="h-5 bg-slate-200 rounded w-3/5"></div>
                        <div class="h-4 bg-slate-200 rounded w-4/5"></div>
                    </div>
                    <div class="h-10 bg-slate-200 rounded w-24"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="h-4 bg-slate-200 rounded w-1/3 mb-4"></div>
                <div class="flex justify-between items-center">
                    <div class="space-y-2 flex-grow">
                        <div class="h-5 bg-slate-200 rounded w-1/2"></div>
                        <div class="h-4 bg-slate-200 rounded w-full"></div>
                    </div>
                    <div class="h-10 bg-slate-200 rounded w-24"></div>
                </div>
            </div>
        </div>
        <div id="pagination-controls" class="mt-8 flex justify-center items-center gap-4">
            <button id="prev-page"
                class="bg-gray-200 hover:bg-gray-300 disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed text-gray-700 font-semibold px-4 py-2 rounded-lg transition-colors duration-200">&lt;
                Previous</button>
            <span id="page-indicator" class="font-semibold text-gray-600"></span>
            <button id="next-page"
                class="bg-gray-200 hover:bg-gray-300 disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed text-gray-700 font-semibold px-4 py-2 rounded-lg transition-colors duration-200">Next
                &gt;</button>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="js/utils.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/app.js" defer></script>

</body>

</html>
