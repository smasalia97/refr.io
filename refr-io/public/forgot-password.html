<!DOCTYPE html>
<html lang="en" class="bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - refr.io</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="antialiased text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto py-4 px-4 md:px-8 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-brand-green">refr.io</a>
            <a href="login.html"
                class="font-semibold text-gray-600 hover:text-brand-green transition-colors flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                        clip-rule="evenodd" />
                </svg>
                <span>Back</span><span class="hidden sm:inline"> to Login</span>
            </a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-8 mt-10">
        <div class="max-w-md mx-auto bg-white border border-slate-200 rounded-xl p-6 md:p-8 shadow-sm">
            <h1 id="form-title" class="text-2xl font-semibold text-gray-900 text-center">Reset your password</h1>
            <p id="form-subtitle" class="text-center text-gray-500 mt-2">Enter your email and we'll send you a reset
                code.</p>

            <form id="forgot-password-form" class="mt-8 space-y-6">
                <div id="email-step">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" name="email" id="email" autocomplete="email" placeholder="you@example.com"
                            class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm" required>
                    </div>
                    <div class="pt-4">
                        <button type="submit" id="send-code-btn"
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-white font-semibold bg-brand-green hover:bg-emerald-700 transition duration-200 ease-in-out">
                            Send Reset Code
                        </button>
                    </div>
                </div>

                <div id="reset-step" class="hidden space-y-6">
                    <div>
                        <label for="code" class="block text-sm font-medium text-gray-700">Confirmation Code</label>
                        <input type="text" name="code" id="code"
                            class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm">
                    </div>
                    <div>
                        <label for="new-password" class="block text-sm font-medium text-gray-700">New Password</label>
                        <div class="relative">
                            <input type="password" name="new-password" id="new-password"
                                class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm">
                            <button type="button" id="toggle-password-visibility"
                                class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500">
                                <svg id="eye-icon" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                                    <path fill-rule="evenodd"
                                        d="M.458 10C1.73 5.943 5.522 3 10 3s8.27 2.943 9.542 7c-1.272 4.057-5.022 7-9.542 7S1.73 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"
                                        clip-rule="evenodd" />
                                </svg>
                                <svg id="eye-slashed-icon" class="h-5 w-5 hidden" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.27 5.943 14.478 3 10 3a9.953 9.953 0 00-4.512 1.074L3.707 2.293zM10 12a2 2 0 100-4 2 2 0 000 4z"
                                        clip-rule="evenodd" />
                                    <path
                                        d="M2 10s3.939-5.291 8-5.291 8 5.291 8 5.291-3.939 5.291-8 5.291S2 10 2 10z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="pt-2">
                        <button type="submit" id="reset-password-btn"
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-white font-semibold bg-brand-green hover:bg-emerald-700 transition duration-200 ease-in-out">
                            Reset Password
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="js/config.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/forgot-password.js" defer></script>
</body>

</html>
