<!DOCTYPE html>
<html lang="en" class="bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>refr.io - Share & Find Referrals</title>

    <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png?v=1.1">
    <link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png?v=1.1">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png?v=1.1">
    <link rel="icon" href="icon/favicon.ico?v=1.1" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="antialiased text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto py-4 px-4 md:px-8 flex justify-between items-center">
            <a href="/dashboard.html" class="text-2xl font-bold text-brand-green">refr.io</a>
            <div id="logged-in-view" class="flex items-center gap-4">
                <a href="/dashboard.html"
                    class="font-semibold text-gray-600 hover:text-brand-green transition-colors flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                            clip-rule="evenodd" />
                    </svg>
                    <span>Back</span><span class="hidden sm:inline"> to Dashboard</span>
                </a>
                <button id="logout-btn"
                    class="font-semibold text-gray-600 hover:text-brand-green transition-colors">Logout</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-8">
        <h1 class="text-xl font-semibold text-gray-900 mt-2 mb-6">Your Profile</h1>
        <div id="profile-details" class="bg-white border border-slate-200 rounded-xl p-5 md:p-6 shadow-sm">
            <p id="loading-message" class="text-gray-500">Loading profile...</p>
        </div>
    </main>

    <div id="edit-name-modal"
        class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 h-full w-full flex items-center justify-center p-4">
        <div class="relative w-full max-w-md p-5 border shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg font-medium text-gray-900 text-center">Edit Your Name</h3>
                <form id="edit-name-form" class="space-y-4 mt-4">
                    <div>
                        <label for="new-name" class="block text-sm font-medium text-gray-700">New Name</label>
                        <input type="text" name="new-name" id="new-name"
                            class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm" required>
                    </div>
                    <div class="px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                        <button type="submit"
                            class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-brand-green text-base font-medium text-white hover:bg-emerald-700 sm:ml-3 sm:w-auto sm:text-sm">Save</button>
                        <button type="button" id="cancel-edit-name-btn"
                            class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:w-auto sm:text-sm">Cancel</button>
                    </div>
                </form>
                <p id="edit-name-message" class="text-center mt-4"></p>
            </div>
        </div>
    </div>

    <div id="change-password-modal"
        class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 h-full w-full flex items-center justify-center p-4">
        <div class="relative w-full max-w-md p-5 border shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg font-medium text-gray-900 text-center">Change Password</h3>
                <form id="change-password-form" class="space-y-4 mt-4">
                    <div>
                        <label for="current-password" class="block text-sm font-medium text-gray-700">Current
                            Password</label>
                        <input type="password" name="current-password" id="current-password"
                            class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm" required>
                    </div>
                    <div>
                        <label for="new-password" class="block text-sm font-medium text-gray-700">New Password</label>
                        <input type="password" name="new-password" id="new-password"
                            class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm" required>
                    </div>
                    <div>
                        <label for="confirm-new-password" class="block text-sm font-medium text-gray-700">Confirm New
                            Password</label>
                        <input type="password" name="confirm-new-password" id="confirm-new-password"
                            class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm" required>
                    </div>
                    <div class="px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                        <button type="submit"
                            class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-brand-green text-base font-medium text-white hover:bg-emerald-700 sm:ml-3 sm:w-auto sm:text-sm">Update
                            Password</button>
                        <button type="button" id="cancel-change-password-btn"
                            class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:w-auto sm:text-sm">Cancel</button>
                    </div>
                </form>
                <p id="change-password-message" class="text-center mt-4"></p>
            </div>
        </div>
    </div>


    <section class="max-w-5xl mx-auto p-4 md:p-8">
        <h2 class="text-xl font-semibold text-gray-900 mt-2 mb-6">Your Referrals</h2>
        <div id="my-referrals-list" class="space-y-4">
            <p id="my-referrals-loading" class="text-gray-500">Loading your referrals...</p>
        </div>
    </section>

    <div id="delete-modal"
        class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 h-full w-full flex items-center justify-center p-4">
        <div class="relative w-full max-w-md p-5 border shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100">
                    <svg class="h-6 w-6 text-red-600" viewBox="0 0 24 24">
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
                <h3 class="text-lg font-medium text-gray-900 mt-2">Delete Referral</h3>
                <p class="text-sm text-gray-500 mt-2 px-7 py-3">Are you sure? This action cannot be undone.</p>
                <div class="px-4 py-3">
                    <button id="confirm-delete-btn"
                        class="px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-700">Delete</button>
                    <button id="cancel-delete-btn"
                        class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md ml-2 hover:bg-gray-300">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js" defer></script>
    <script src="js/profile.js" defer></script>
</body>

</html>
