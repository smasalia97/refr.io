<!DOCTYPE html>
<html lang="en" class="bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - refr.io</title>

    <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png?v=1.1">
    <link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png?v=1.1">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png?v=1.1">
    <link rel="icon" href="icon/favicon.ico?v=1.1" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Style for password criteria list */
        .password-criteria li {
            transition: color 0.2s ease-in-out;
        }
    </style>

    <meta name="description"
        content="Create your refr.io account in seconds. Join a community of users sharing the best referral codes and start earning rewards today.">
</head>

<body class="antialiased text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto py-4 px-4 md:px-8 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-brand-green">refr.io</a>
            <div class="flex items-center gap-4">
                <a href="login.html"
                    class="font-semibold text-gray-600 hover:text-brand-green transition-colors">Login</a>
                <a href="signup.html"
                    class="bg-brand-green text-white font-semibold px-5 py-2 rounded-lg shadow-md hover:bg-emerald-700 transition duration-200 ease-in-out hover:-translate-y-px transform min-h-[40px] flex items-center">
                    Sign Up
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:px-6 md:px-12 lg:px-20 mt-16 mb-16">
        <div class="max-w-md mx-auto bg-white border border-slate-200 rounded-2xl p-8 md:p-12 shadow-xl space-y-4">
            <h1 id="form-title" class="text-3xl font-bold text-gray-900 text-center mt-2">Create an Account</h1>
            <p id="form-subtitle" class="text-center text-gray-500 mt-4 mb-6">Join to share and find the best referrals.
            </p>

            <form id="signup-form" class="space-y-6 mt-4">
                <div id="initial-signup-fields" class="space-y-4">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                        <input type="text" name="name" id="name" autocomplete="name" placeholder="John Doe"
                            class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent sm:text-sm min-h-[40px] transition duration-200 ease-in-out"
                            required>
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" name="email" id="email" autocomplete="email" placeholder="you@example.com"
                            class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent sm:text-sm min-h-[40px] transition duration-200 ease-in-out"
                            required>
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <div class="relative">
                            <input type="password" name="password" id="password" autocomplete="new-password"
                                class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent sm:text-sm min-h-[40px] transition duration-200 ease-in-out"
                                required>
                            <button type="button" id="toggle-password-visibility"
                                class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500">
                                <svg id="eye-icon" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                                    <path fill-rule="evenodd"
                                        d="M.458 10C1.73 5.943 5.522 3 10 3s8.27 2.943 9.542 7c-1.272 4.057-5.022 7-9.542 7S1.73 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"
                                        clip-rule="evenodd" />
                                </svg>
                                <svg id="eye-slashed-icon" class="h-5 w-5 hidden" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.27 5.943 14.478 3 10 3a9.953 9.953 0 00-4.512 1.074L3.707 2.293zM10 12a2 2 0 100-4 2 2 0 000 4z"
                                        clip-rule="evenodd" />
                                    <path
                                        d="M2 10s3.939-5.291 8-5.291 8 5.291 8 5.291-3.939 5.291-8 5.291S2 10 2 10z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div id="password-criteria-container" class="hidden">
                        <ul class="text-sm text-gray-500 space-y-1 mt-2 password-criteria">
                            <li id="length-check">At least 8 characters</li>
                            <li id="case-check">An uppercase &amp; lowercase letter</li>
                            <li id="number-check">At least one number</li>
                            <li id="symbol-check">At least one special character (!@#$...)</li>
                        </ul>
                    </div>
                    <div>
                        <label for="confirm-password" class="block text-sm font-medium text-gray-700">Confirm
                            Password</label>
                        <div class="relative">
                            <input type="password" name="confirm-password" id="confirm-password"
                                autocomplete="new-password"
                                class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent sm:text-sm min-h-[40px] transition duration-200 ease-in-out"
                                required>
                            <button type="button" id="toggle-confirm-password-visibility"
                                class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500">
                                <svg id="confirm-eye-icon" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                                    <path fill-rule="evenodd"
                                        d="M.458 10C1.73 5.943 5.522 3 10 3s8.27 2.943 9.542 7c-1.272 4.057-5.022 7-9.542 7S1.73 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"
                                        clip-rule="evenodd" />
                                </svg>
                                <svg id="confirm-eye-slashed-icon" class="h-5 w-5 hidden"
                                    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.27 5.943 14.478 3 10 3a9.953 9.953 0 00-4.512 1.074L3.707 2.293zM10 12a2 2 0 100-4 2 2 0 000 4z"
                                        clip-rule="evenodd" />
                                    <path
                                        d="M2 10s3.939-5.291 8-5.291 8 5.291 8 5.291-3.939 5.291-8 5.291S2 10 2 10z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="confirmation-fields" class="hidden space-y-4">
                    <div>
                        <label for="confirmation-code" class="block text-sm font-medium text-gray-700">Confirmation
                            Code</label>
                        <input type="text" name="confirmation-code" id="confirmation-code"
                            placeholder="Enter the code from your email"
                            class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent sm:text-sm min-h-[40px] transition duration-200 ease-in-out">
                    </div>
                </div>

                <div class="pt-4 space-y-3">
                    <button id="signup-btn" type="submit"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-white font-semibold bg-brand-green hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition duration-200 ease-in-out transform hover:scale-[1.01]">
                        Create Account
                    </button>
                    <button id="confirm-btn" type="button"
                        class="hidden w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-white font-semibold bg-brand-green hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition duration-200 ease-in-out transform hover:scale-[1.01]">
                        Confirm Account
                    </button>
                </div>
            </form>

            <p id="form-message" class="text-center mt-4"></p>

            <p class="text-center text-sm text-gray-500 mt-8">
                Already have an account?
                <a href="login.html" class="font-medium text-brand-green hover:underline">Log in</a>
            </p>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="js/utils.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/signup.js" defer></script>
</body>

</html>
